
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maombi ya Mkopo | Mfano Huru</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <span class="logo-mark">M</span>
      <span>MAOMBI YA MKOPO</span>
    </div>
    <span class="demo-tag">MFANO HURU</span>
  </header>

  <main class="container">

    <div class="notice">
      Huu ni mfano huru wa tovuti. Si tovuti rasmi ya Halotel.
    </div>

    <div class="progress">
      <span class="active">1</span>
      <i></i>
      <span>2</span>
      <i></i>
      <span>3</span>
      <i></i>
      <span>4</span>
    </div>

    <section class="card" id="step1">

      <p class="eyebrow">HATUA YA 1 KATI YA 4</p>

      <h1>Chagua kiasi cha mkopo</h1>

      <p class="muted">
        Tumia kitelezi kuchagua kiasi unachotaka kuomba.
      </p>

      <div class="amount" id="amountText">
        50,000 TZS
      </div>

      <input
        id="loanAmount"
        type="range"
        min="10000"
        max="1000000"
        step="10000"
        value="50000"
      >

      <div class="range-labels">
        <span>10,000 TZS</span>
        <span>1,000,000 TZS</span>
      </div>

      <button id="toDetails">
        Endelea
      </button>

    </section>

    <footer>
      © Mfano wa mafunzo
    </footer>

  </main>

  <script src="app.js"></script>

</body>
</html>
